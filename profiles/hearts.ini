# WinEXE OSD profile — genuine XP Hearts
# User-supplied: mshearts.exe + cards.dll + MFC42u.dll from the XP SP3 ISO
# (not in git). Local computer opponents; no DirectPlay/network imports.
# cards=n and mfc42u=n load the XP sidecars; do not change the shared prefix.

[osd]
index=8
menu=1

[app]
name=Hearts
exe=/media/fat/games/WinEXE/apps/xp-games/mshearts.exe
unix_exe=/media/fat/games/WinEXE/apps/xp-games/mshearts.exe
workdir=/media/fat/games/WinEXE/apps/xp-games
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/games/WinEXE/apps/xp-games/mshearts.exe
optional=/media/fat/games/WinEXE/apps/xp-games/cards.dll

[runtime]
box86=
wine_prefix=/media/fat/games/WinEXE/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d;cards=n;mfc42u=n
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000080

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=mshearts.exe

[helpers]
pre=
post=
background=
cleanup=

[config]
registry=
script=
