# WinEXE OSD profile — genuine XP Paint
# User-supplied: apps/mspaint.exe and optional apps/MFC42u.dll (not in git)

[osd]
index=1
menu=1

[app]
name=Paint
exe=/media/fat/Windows/apps/mspaint.exe
workdir=/media/fat/Windows/apps
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/apps/mspaint.exe
optional=/media/fat/Windows/apps/MFC42u.dll

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000080

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=

[helpers]
pre=
post=
background=
cleanup=

[config]
registry=
script=
