# WinEXE profile — stock Command & Conquer Gold (Nod Windows 95, C&C95.EXE)
# User-supplied tree under /media/fat/Windows/apps/cnc/ (not in git).
# 16-bit SETUP.EXE is not run. CD ISO is attached as Wine D: by the helper.
# No C&C-specific launcher branches. 640×480 BGRX presenter unchanged.

[osd]
index=4
menu=1

[app]
name=Command & Conquer
exe=/media/fat/Windows/apps/cnc/C&C95.EXE
unix_exe=/media/fat/Windows/apps/cnc/C&C95.EXE
workdir=/media/fat/Windows/apps/cnc
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/apps/cnc/C&C95.EXE

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=+err,+ddraw

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=C&C95.EXE

[helpers]
pre=ss1-winexe-cnc-cd.sh start
post=
background=
cleanup=ss1-winexe-cnc-cd.sh stop

[config]
registry=
script=
