# WinEXE profile — Command & Conquer for Windows 95 (DirectDraw probe)
# User-supplied Win95 tree (not in git). Want C&C95.EXE (PE32), not DOS CONQUER.EXE.
# No C&C-specific launcher code. First run uses today's BGRX32 path unchanged.
# OSD index 4 is reserved; the live RBF O[2:1] selector cannot encode it yet.

[osd]
index=4
menu=1

[app]
name=Command & Conquer
exe=C:\CNC\C&C95.EXE
unix_exe=/media/fat/Windows/wineprefix-prebuilt/drive_c/CNC/C&C95.EXE
workdir=/media/fat/Windows/wineprefix-prebuilt/drive_c/CNC
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/wineprefix-prebuilt/drive_c/CNC/C&C95.EXE

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=+err,+loaddll,+ddraw
BOX86_LOG=1
BOX86_NOBANNER=0

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=C&C95.EXE

[helpers]
pre=
post=
background=
cleanup=

[config]
registry=
script=
