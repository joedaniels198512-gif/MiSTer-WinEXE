# WinEXE profile — stock Command & Conquer Gold (Nod Windows 95, C&C95.EXE)
# User-supplied tree under /media/fat/games/WinEXE/apps/cnc/ (not in git).
# 16-bit SETUP.EXE is not run. CD ISO is attached as Wine D: by the helper.
# Direct PAL8 is optional (SS1_PAL8=1). BGRX desktop remains the fallback.

[osd]
index=4
menu=1

[app]
name=Command & Conquer
exe=/media/fat/games/WinEXE/apps/cnc/C&C95.EXE
unix_exe=/media/fat/games/WinEXE/apps/cnc/C&C95.EXE
workdir=/media/fat/games/WinEXE/apps/cnc
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/games/WinEXE/apps/cnc/C&C95.EXE

[runtime]
box86=
wine_prefix=/media/fat/games/WinEXE/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=-all
SS1_PAL8=1

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=C&C95.EXE

[helpers]
pre=ss1-winexe-cnc-cd.sh start; ss1-cnc-capslie.sh start
post=
background=ss1-cnc-pal8.sh start
cleanup=ss1-winexe-cnc-cd.sh stop; ss1-cnc-pal8.sh stop; ss1-cnc-capslie.sh stop

[config]
registry=
script=
