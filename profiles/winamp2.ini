# WinEXE OSD profile — Winamp 2.91
# User-supplied prefix install: C:\Program Files\Winamp\winamp.exe (not in git)
# First-run / Gecko / out_wave.dll are applied by ss1-winexe-winamp-config.sh
# OSD launch does not auto-play a track. Extra args may be appended from SSH.

[osd]
index=2
menu=1

[app]
name=Winamp 2
exe=C:\Program Files\Winamp\winamp.exe
unix_exe=/media/fat/Windows/wineprefix-prebuilt/drive_c/Program Files/Winamp/winamp.exe
workdir=/media/fat/Windows/wineprefix-prebuilt/drive_c/Program Files/Winamp
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/wineprefix-prebuilt/drive_c/Program Files/Winamp/winamp.exe

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d;mshtml=d;ieframe=d;shdocvw=d
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=

[helpers]
pre=ss1-winexe-winamp-config.sh
post=
background=
cleanup=

[config]
registry=
script=ss1-winexe-winamp-config.sh
