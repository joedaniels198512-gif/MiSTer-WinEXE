# WinEXE OSD profile — genuine XP FreeCell
# User-supplied: freecell.exe + cards.dll from the XP SP3 ISO (not in git)
# cards=n: Wine builtin cards.dll has no working cdtDrawExt (empty table).
# post helper sends F2 once the window is up (stock EXE does not auto-deal here).

[osd]
index=7
menu=1

[app]
name=FreeCell
exe=/media/fat/Windows/apps/xp-games/freecell.exe
unix_exe=/media/fat/Windows/apps/xp-games/freecell.exe
workdir=/media/fat/Windows/apps/xp-games
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/apps/xp-games/freecell.exe
optional=/media/fat/Windows/apps/xp-games/cards.dll

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d;cards=n
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000080

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=freecell.exe

[helpers]
pre=
post=ss1-winexe-freecell-deal.sh
background=
cleanup=

[config]
registry=
script=
