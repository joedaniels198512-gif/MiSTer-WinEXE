# WinEXE OSD profile — genuine XP Solitaire
# User-supplied: sol.exe + cards.dll from the XP SP3 ISO (not in git)
# cards=n loads the genuine XP cards.dll from the app directory.

[osd]
index=6
menu=1

[app]
name=Solitaire
exe=/media/fat/Windows/apps/xp-games/sol.exe
unix_exe=/media/fat/Windows/apps/xp-games/sol.exe
workdir=/media/fat/Windows/apps/xp-games
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/apps/xp-games/sol.exe
optional=/media/fat/Windows/apps/xp-games/cards.dll

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d;cards=n
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000080

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=sol.exe

[helpers]
pre=
post=
background=
cleanup=

[config]
registry=
script=
