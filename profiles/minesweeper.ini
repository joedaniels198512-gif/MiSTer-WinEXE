# WinEXE OSD profile — genuine XP Minesweeper
# User-supplied: /media/fat/games/WinEXE/apps/xp-games/winmine.exe (not in git)

[osd]
index=5
menu=1

[app]
name=Minesweeper
exe=/media/fat/games/WinEXE/apps/xp-games/winmine.exe
unix_exe=/media/fat/games/WinEXE/apps/xp-games/winmine.exe
workdir=/media/fat/games/WinEXE/apps/xp-games
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/games/WinEXE/apps/xp-games/winmine.exe

[runtime]
box86=
wine_prefix=/media/fat/games/WinEXE/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=+err

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000080

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=winmine.exe

[helpers]
pre=
post=
background=
cleanup=

[config]
registry=
script=
