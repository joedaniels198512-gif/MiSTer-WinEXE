# WinEXE OSD profile — original Win95 SimCity 2000
# User-supplied: entire C:\SC2K\ tree (not in git). Do not use sc2kfix / SETUP.EXE.
# All proven per-app fixes live here so the launcher has no SC2K special case.

[osd]
index=3
menu=1

[app]
name=SimCity 2000
exe=C:\SC2K\SIMCITY.EXE
unix_exe=/media/fat/Windows/wineprefix-prebuilt/drive_c/SC2K/SIMCITY.EXE
workdir=/media/fat/Windows/wineprefix-prebuilt/drive_c/SC2K
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/Windows/wineprefix-prebuilt/drive_c/SC2K/SIMCITY.EXE

[runtime]
box86=
wine_prefix=/media/fat/Windows/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=+err,+loaddll

[display]
presenter_hz=30
skip_unchanged=1
dirty=1
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=0x1
presenter_affinity=0x2
xorg_affinity=0x2
app_comm=SIMCITY.EXE

[helpers]
pre=ss1-winexe-sc2k-config.sh
post=
background=ss1-winexe-sc2k-toolbar.sh watch
cleanup=ss1-winexe-sc2k-toolbar.sh stop

[config]
registry=ss1-winexe-sc2k.reg
script=ss1-winexe-sc2k-config.sh
