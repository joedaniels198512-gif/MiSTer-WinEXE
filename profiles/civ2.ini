# WinEXE OSD profile — Civilization II Multiplayer Gold Edition (USA)
# User-supplied tree under /media/fat/games/WinEXE/apps/civ2/ (not in git).
# 16-bit SETUP.EXE is not run. Data-track ISO is attached as Wine D: by
# the helper. Original mixed-mode BIN/CUE stays intact (CD audio later).

[osd]
index=9
menu=1

[app]
name=Civilization II
exe=/media/fat/games/WinEXE/apps/civ2/civ2.exe
unix_exe=/media/fat/games/WinEXE/apps/civ2/civ2.exe
workdir=/media/fat/games/WinEXE/apps/civ2
args=
explorer=1
desktop=ss1,640x480
require=/media/fat/games/WinEXE/apps/civ2/civ2.exe

[runtime]
box86=
wine_prefix=/media/fat/games/WinEXE/wineprefix-prebuilt

[env]
WINEDLLOVERRIDES=winemenubuilder.exe=d
WINEDEBUG=-all
SS1_CIV2_CDAUDIO=1
SS1_CIV2_CDAUDIO_DIR=/media/fat/games/WinEXE/apps/civ2/cdaudio
LD_PRELOAD=/media/fat/games/WinEXE/bin/ss1-civ2-cdaudio.so

[display]
presenter_hz=60
skip_unchanged=1
dirty=0
tile_w=32
tile_h=32
dirty_pct=60
fb_format=auto
xsetroot=#000000

[cpu]
app_affinity=
presenter_affinity=0x3
xorg_affinity=0x3
app_comm=civ2.exe

[helpers]
pre=ss1-winexe-civ2-cd.sh start; ss1-winexe-civ2-cdaudio.sh start
post=
background=
cleanup=ss1-winexe-civ2-cd.sh stop; ss1-winexe-civ2-cdaudio.sh stop

[config]
registry=
script=
