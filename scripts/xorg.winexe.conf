# Xorg dummy 640x480 for WinEXE_Test. Not /dev/fb0.
# ModulePath/FontPath rewritten by ss1-winexe-xorg.sh.
Section "ServerLayout"
    Identifier     "WinEXE"
    Screen         0 "Screen0"
    InputDevice    "Mouse0" "CorePointer"
    InputDevice    "Keyboard0" "CoreKeyboard"
EndSection

Section "Files"
    ModulePath     "/media/fat/games/WinEXE/x11/lib/xorg/modules"
    FontPath       "/media/fat/games/WinEXE/x11/share/fonts/X11/misc"
    FontPath       "/media/fat/games/WinEXE/x11/share/fonts/X11/encodings"
EndSection

Section "Module"
    Disable        "glx"
    Disable        "glamoregl"
    Disable        "dri"
    Disable        "dri2"
    Load           "evdev"
EndSection

Section "InputDevice"
    Identifier     "Mouse0"
    Driver         "evdev"
    Option         "Device" "/dev/input/event0"
    Option         "GrabDevice" "false"
EndSection

Section "InputDevice"
    Identifier     "Keyboard0"
    Driver         "evdev"
    Option         "Device" "/dev/input/event1"
    Option         "GrabDevice" "false"
    Option         "XkbRules" "evdev"
    Option         "XkbModel" "pc105"
    Option         "XkbLayout" "us"
EndSection

Section "ServerFlags"
    Option         "AutoAddDevices" "false"
    Option         "AutoEnableDevices" "false"
    Option         "AutoAddGPU" "false"
    Option         "AllowMouseOpenFail" "true"
    Option         "DontZap" "false"
EndSection

Section "Device"
    Identifier     "Card0"
    Driver         "dummy"
    VideoRam       8192
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync      30.0-100.0
    VertRefresh    50.0-90.0
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Card0"
    Monitor        "Monitor0"
    DefaultDepth   24
    SubSection     "Display"
        Depth      24
        Modes      "640x480"
        Virtual    640 480
    EndSubSection
EndSection
