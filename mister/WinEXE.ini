# WinEXE core-specific MiSTer.ini fragment
#
# Append these sections to /media/fat/MiSTer.ini. Main only parses
# MiSTer.ini (and MiSTer_alt*.ini), not a standalone WinEXE.ini file.
# After the RBF CONF_STR name is known, cfg_parse() reads the matching
# [section]. If main= points at a different executable than the running
# process, user_io_init() calls app_restart() and execs that binary with
# the same core path.
#
# Do not set this until MiSTer_WinEXE is built and installed at
# /media/fat/MiSTer_WinEXE. getFullPath() resolves a bare filename under
# the SD root. A missing path is skipped (FileExists check).
#
# [WinEXE_Test] covers the current RBF until the first OSD CONF_STR rename.

[WinEXE]
main=MiSTer_WinEXE

[WinEXE_Test]
main=MiSTer_WinEXE
