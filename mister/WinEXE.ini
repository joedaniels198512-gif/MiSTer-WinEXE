# WinEXE core-specific MiSTer.ini fragment
#
# Copy to /media/fat/WinEXE.ini (or add a [WinEXE] section to MiSTer.ini).
# Main_MiSTer reads this after the RBF CONF_STR name is known. If main=
# points at a different executable than the running process, user_io_init
# calls app_restart() and execs that binary with the same core path.
#
# Do not set this until MiSTer_WinEXE is built and installed. The stock
# MiSTer binary will ignore unknown cores and keep working; a missing
# main= path is skipped (FileExists check).
#
# Place the custom binary next to the stock one, typically:
#   /media/fat/MiSTer_WinEXE
# getFullPath() resolves a bare filename under the SD root.

[WinEXE]
main=MiSTer_WinEXE
