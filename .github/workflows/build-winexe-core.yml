name: Build WinEXE FPGA core

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "fpga/**"
      - "scripts/ss1-winexe-present.c"
      - "scripts/ss1-pal8-map.c"
      - "scripts/ss1-pal8.h"
      - "scripts/ss1-civ2-cdaudio.c"
      - "scripts/ss1-cnc-pal8*.c"
      - "scripts/ss1-cnc-capslie.c"
      - "scripts/ss1-cnc-cdprobe.c"
      - ".github/workflows/build-winexe-core.yml"

permissions:
  contents: read

jobs:
  compile-arm-presenter:
    name: Cross-compile ss1-winexe-present
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM helpers against Bullseye glibc
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bullseye bash -lc '
            set -euo pipefail
            printf "deb http://snapshot.debian.org/archive/debian/20220419T021707Z bullseye main\n" > /etc/apt/sources.list
            printf "Acquire::Check-Valid-Until \"false\";\n" > /etc/apt/apt.conf.d/99snapshot
            apt-get update
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            arm-linux-gnueabihf-gcc -O2 -Wall -static -o ss1-winexe-present scripts/ss1-winexe-present.c
            arm-linux-gnueabihf-gcc -O2 -Wall -fPIC -shared -pthread -o ss1-pal8-map.so scripts/ss1-pal8-map.c
            arm-linux-gnueabihf-gcc -O2 -Wall -fPIC -shared -pthread -o ss1-civ2-cdaudio.so scripts/ss1-civ2-cdaudio.c -ldl
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ss1-winexe-present
          path: ss1-winexe-present
          if-no-files-found: error
      - name: Record ss1-pal8-map.so provenance
        run: python3 release/artifacts.py stamp ss1-pal8-map.so

      - uses: actions/upload-artifact@v4
        with:
          name: ss1-pal8-map.so
          path: |
            ss1-pal8-map.so
            ss1-pal8-map.so.provenance.json
          if-no-files-found: error
      - name: Record ss1-civ2-cdaudio.so provenance
        run: python3 release/artifacts.py stamp ss1-civ2-cdaudio.so

      - uses: actions/upload-artifact@v4
        with:
          name: ss1-civ2-cdaudio.so
          path: |
            ss1-civ2-cdaudio.so
            ss1-civ2-cdaudio.so.provenance.json
          if-no-files-found: error

  compile-pal8-guest:
    name: Cross-compile ss1-cnc-pal8.dll
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686
      - name: Build
        run: |
          i686-w64-mingw32-gcc -O2 -Wall -shared -o ss1-cnc-pal8.dll \
            scripts/ss1-cnc-pal8-hook.c -static-libgcc
          i686-w64-mingw32-gcc -O2 -Wall -s -mwindows -o ss1-cnc-pal8.exe \
            scripts/ss1-cnc-pal8.c -static-libgcc
          i686-w64-mingw32-gcc -O2 -Wall -s -mwindows -o ss1-cnc-capslie.exe \
            scripts/ss1-cnc-capslie.c -static-libgcc
          i686-w64-mingw32-gcc -O2 -Wall -s -mwindows -o ss1-cnc-cdprobe.exe \
            scripts/ss1-cnc-cdprobe.c -static-libgcc
          i686-w64-mingw32-size ss1-cnc-pal8.dll ss1-cnc-pal8.exe ss1-cnc-capslie.exe ss1-cnc-cdprobe.exe
      - name: Record ss1-cnc-pal8-guest provenance
        run: python3 release/artifacts.py stamp ss1-cnc-pal8-guest

      - uses: actions/upload-artifact@v4
        with:
          name: ss1-cnc-pal8-guest
          path: |
            ss1-cnc-pal8.dll
            ss1-cnc-pal8.exe
            ss1-cnc-capslie.exe
            ss1-cnc-cdprobe.exe
            ss1-cnc-pal8-guest.provenance.json
          if-no-files-found: error

  compile-fpga:
    name: Quartus 17 WinEXE.rbf
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Static sanity (fail before Quartus if wrong)
        run: |
          set -euo pipefail
          qsf=fpga/WinEXE.qsf
          sv=fpga/WinEXE.sv
          grep -q 'VERILOG_MACRO "MISTER_FB=1"' "$qsf"
          grep -v '^#' "$qsf" | grep -q 'MISTER_FB=1'
          grep -q "32'h3000_0000" "$sv"
          grep -q "12'd640" "$sv"
          grep -q "12'd480" "$sv"
          grep -q "14'd2560" "$sv"
          grep -q "5'b10110" "$sv"
          grep -v '^#' "$qsf" | grep -q 'MISTER_FB_PALETTE=1'
          grep -q "32'h3020_0000" "$sv"
          grep -q "5'b00011" "$sv"
          grep -q "module pal8_fbctl" fpga/rtl/pal8_fbctl.v
          if grep -qiE 'fb_line_reader|module[[:space:]]+mycore' fpga/WinEXE.qip fpga/WinEXE.sv fpga/rtl/*.v; then
            echo "Unexpected legacy framebuffer implementation" >&2
            exit 1
          fi
          test ! -e fpga/rtl/fb_line_reader.v
          test ! -e fpga/rtl/mycore.v
          test -f fpga/sys/sys_top.v
          test -f fpga/sys/ascal.vhd
          test -f fpga/sys/emu_ports.vh
          test -f fpga/rtl/pll.qip
          test -f fpga/rtl/pll.v
          test -f fpga/rtl/vga640.v
          test -f fpga/rtl/pal8_fbctl.v
          test -f fpga/WinEXE.qpf
          echo SANITY_OK

      - name: Compile WinEXE core (Quartus 17.0)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/fpga:/build" -w /build \
            raetro/quartus:17.0 \
            sh -c 'quartus_sh --flow compile WinEXE.qpf'
          cp -f fpga/output_files/WinEXE.rbf "$GITHUB_WORKSPACE/WinEXE.rbf"
          ls -l fpga/output_files/WinEXE.rbf

      - name: Record WinEXE.rbf provenance
        run: python3 release/artifacts.py stamp WinEXE.rbf

      - uses: actions/upload-artifact@v4
        with:
          name: WinEXE.rbf
          path: |
            WinEXE.rbf
            WinEXE.rbf.provenance.json
          if-no-files-found: error

      - name: Upload compilation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
          if-no-files-found: ignore
