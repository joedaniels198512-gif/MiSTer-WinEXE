name: Release sanity and package

# Builds a FAT-rooted WinEXE-v0.1.0-beta.zip
# (_Computer/, Scripts/, docs/WinEXE/, games/WinEXE/). Place CI binaries in artifacts/.

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "LICENSE"
      - "COPYING"
      - "THIRD_PARTY_NOTICES.md"
      - "VERSION"
      - "install.sh"
      - "release/**"
      - "profiles/**"
      - "wex/**"
      - "scripts/ss1-winexe-*.sh"
      - "scripts/ss1-cnc-*.sh"
      - "scripts/ss1-x11-env.sh"
      - "scripts/ss1-xorg.sh"
      - "scripts/ss1-mount-prefix.sh"
      - "scripts/xorg.winexe.conf"
      - "docs/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  sanity-and-zip:
    name: Release check + zip
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sanity
        run: |
          chmod +x scripts/ss1-winexe-release-check.sh \
                   scripts/ss1-winexe-package-release.sh \
                   scripts/ss1-winexe-install-layout.sh \
                   scripts/ss1-winexe-check-layout.sh \
                   install.sh \
                   scripts/wine scripts/wineserver \
                   scripts/winexe-env.sh
          if [ -f "scripts/WinEXE Installer.sh" ]; then
            chmod +x "scripts/WinEXE Installer.sh"
          fi
          if [ -f "Scripts/WinEXE Installer.sh" ]; then
            chmod +x "Scripts/WinEXE Installer.sh"
          fi
          scripts/ss1-winexe-release-check.sh

      - name: Stage a fake SD tree
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/fat"
          mkdir -p "$STAGE"
          scripts/ss1-winexe-install-layout.sh "$STAGE"
          scripts/ss1-winexe-check-layout.sh "$STAGE"

      - name: Package zip
        run: |
          mkdir -p dist
          scripts/ss1-winexe-package-release.sh "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/dist/WinEXE-v0.1.0-beta.zip"
          unzip -l dist/WinEXE-v0.1.0-beta.zip | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: WinEXE-v0.1.0-beta
          path: dist/WinEXE-v0.1.0-beta.zip
          if-no-files-found: error
