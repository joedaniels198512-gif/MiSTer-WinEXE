name: Build WinEXE X11 presenter

# ARM-only. Do not compile the FPGA core here.
# Target glibc 2.31 (MiSTer) via Debian Bullseye armhf-cross, not Ubuntu 22.04.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ss1-winexe-x11-present.c"
      - ".github/workflows/build-winexe-presenter.yml"

permissions:
  contents: read

jobs:
  compile-arm-presenter:
    name: Cross-compile ss1-winexe-x11-present
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build presenter + extract dummy in Debian Bullseye
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bullseye bash -lc '
            set -euo pipefail
            SNAP=http://snapshot.debian.org/archive/debian/20220419T021707Z
            printf "deb %s bullseye main\n" "$SNAP" > /etc/apt/sources.list
            printf "Acquire::Check-Valid-Until \"false\";\n" > /etc/apt/apt.conf.d/99snapshot
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
              wget ca-certificates binutils file
            mkdir -p debs extract
            UA="ss1-winexe-presenter/1.0"
            fetch() { wget -q --user-agent="$UA" -P debs "$1"; }
            fetch "$SNAP/pool/main/libx/libx11/libx11-6_1.7.2-1_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxext/libxext6_1.3.3-1.1_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxfixes/libxfixes3_5.0.3-2_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxcb/libxcb1_1.14-3_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxau/libxau6_1.0.9-1_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxdmcp/libxdmcp6_1.1.2-3_armhf.deb"
            fetch "$SNAP/pool/main/libb/libbsd/libbsd0_0.11.3-1_armhf.deb"
            fetch "$SNAP/pool/main/libm/libmd/libmd0_1.0.3-3_armhf.deb"
            fetch "$SNAP/pool/main/libx/libx11/libx11-dev_1.7.2-1_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxext/libxext-dev_1.3.3-1.1_armhf.deb"
            fetch "$SNAP/pool/main/libx/libxfixes/libxfixes-dev_5.0.3-2_armhf.deb"
            fetch "$SNAP/pool/main/x/xorgproto/x11proto-dev_2020.1-1_all.deb"
            fetch "$SNAP/pool/main/x/xserver-xorg-video-dummy/xserver-xorg-video-dummy_0.3.8-1+b1_armhf.deb"
            for deb in debs/*.deb; do
              dpkg-deb -x "$deb" extract
            done
            cp -a extract/usr/lib/xorg/modules/drivers/dummy_drv.so dummy_drv.so
            LIBDIR=extract/usr/lib/arm-linux-gnueabihf
            INCDIR=extract/usr/include
            ln -sfn libX11.so.6 "$LIBDIR/libX11.so"
            ln -sfn libXext.so.6 "$LIBDIR/libXext.so"
            ln -sfn libXfixes.so.3 "$LIBDIR/libXfixes.so"
            arm-linux-gnueabihf-gcc -O2 -Wall \
              -o ss1-winexe-x11-present scripts/ss1-winexe-x11-present.c \
              -I"$INCDIR" \
              -L"$LIBDIR" -Wl,-rpath-link,"$LIBDIR" \
              -lX11 -lXext -lXfixes \
              -Wl,-rpath,/media/fat/Windows/x11/lib
            file ss1-winexe-x11-present dummy_drv.so
            arm-linux-gnueabihf-readelf -d ss1-winexe-x11-present | grep NEEDED
            echo "=== GLIBC symbols ==="
            arm-linux-gnueabihf-objdump -T ss1-winexe-x11-present | awk "/GLIBC_/ {print \$NF}" | sort -u
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ss1-winexe-x11-present
          path: ss1-winexe-x11-present
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dummy_drv.so
          path: dummy_drv.so
          if-no-files-found: error
