name: Build WinEXE X11 presenter

# ARM-only. Do not compile the FPGA core here.
# Binary must target glibc 2.31 (MiSTer), so compile inside Debian Bullseye.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ss1-winexe-x11-present.c"
      - ".github/workflows/build-winexe-presenter.yml"

permissions:
  contents: read

jobs:
  compile-arm-presenter:
    name: Cross-compile ss1-winexe-x11-present
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build presenter + extract dummy in Debian Bullseye
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:bullseye bash -lc '
            set -euo pipefail
            dpkg --add-architecture armhf
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
              libx11-dev:armhf libxext-dev:armhf libxfixes-dev:armhf \
              wget ca-certificates binutils file
            SNAP=https://snapshot.debian.org/archive/debian/20220419T021707Z/pool/main
            wget -q --user-agent="ss1-winexe-presenter/1.0" -O dummy.deb \
              "$SNAP/x/xserver-xorg-video-dummy/xserver-xorg-video-dummy_0.3.8-1+b1_armhf.deb"
            dpkg-deb -x dummy.deb dummy-extract
            cp -a dummy-extract/usr/lib/xorg/modules/drivers/dummy_drv.so dummy_drv.so
            arm-linux-gnueabihf-gcc -O2 -Wall \
              -o ss1-winexe-x11-present scripts/ss1-winexe-x11-present.c \
              -L/usr/lib/arm-linux-gnueabihf -lX11 -lXext -lXfixes \
              -Wl,-rpath,/media/fat/Windows/x11/lib
            file ss1-winexe-x11-present dummy_drv.so
            arm-linux-gnueabihf-readelf -d ss1-winexe-x11-present | grep NEEDED
            echo "=== GLIBC symbols ==="
            arm-linux-gnueabihf-objdump -T ss1-winexe-x11-present | awk "/GLIBC_/ {print \$NF}" | sort -u
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ss1-winexe-x11-present
          path: ss1-winexe-x11-present
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dummy_drv.so
          path: dummy_drv.so
          if-no-files-found: error
